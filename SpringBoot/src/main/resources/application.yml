spring:
  application:
    name: competition-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/project_sunhao?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  type-aliases-package: com.project.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 2301

file:
  upload-dir: E:/lunwen_project/First/sunhao/SpringBoot/files/

# JWT Configuration
jwt:
  secret: competition-system-secret-key-2026
  expiration: 86400000

github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:2301/api/user/oauth/github/callback}
    frontend-success-url: ${GITHUB_FRONTEND_SUCCESS_URL:http://localhost:2302/login}
